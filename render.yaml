services:
  - type: web
    name: criczone-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: MONGO_URI
        sync: false
      - key: MONGO_DATABASE
        value: "criczone"
      - key: CLIENT_URL
        sync: false
      - key: ALLOW_ALL_ORIGINS
        value: "false"
      - key: KAFKA_ENABLED
        value: "false"
